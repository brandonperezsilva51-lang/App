name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Descomprimir proyecto
        run: unzip -q "$(ls *.zip | head -1)" -d fuente
      - name: Compilar
        run: gradle assembleDebug --no-daemon -p fuente/proyecto_apk_manual/android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: fuente/proyecto_apk_manual/android/app/build/outputs/apk/debug/app-debug.apk
